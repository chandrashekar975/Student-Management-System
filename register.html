<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <nav>
        <a href="index.html">Home</a> |
        <a href="login.html">Login</a> |
        <a href="register.html">Register</a>
    </nav>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Register</h1>

    <form onsubmit="return validateForm(event)">
        <label for="username">Username: </label>
        <input type="text" id="username" name="username" required>
        <br><br>
        <label for="email">Email: </label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="password">Password: </label>
        <input type="password" id="password" name="password" required>
        <br><br>
        <label for="confirm_password">Confirm Password: </label>
        <input type="password" id="confirm_password" name="confirm_password" required>
        <br><br>
        <button type="submit">Register</button>
    </form>

    Already have an account?
    <br>
    <a href="login.html">Login here</a>.

    <p id="message-display" class="error"></p>
</body>
<script>
    function validateForm(event) {
        var username = document.getElementById("username").value;
        var email = document.getElementById("email").value;
        var password = document.getElementById("password").value;
        var confirm = document.getElementById("confirm_password").value;
        var display = document.getElementById("message-display");

        display.textContent = "";
        display.className = "error";
        event.preventDefault();

        var userexp = /^[A-Za-z0-9]{8,}$/;
        if (!userexp.test(username)) {
            display.textContent = "Invalid Username! Username must be at least 8 characters long and contain only alphanumeric characters";
            return false;
        }
        var passwordexp = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*]).{8,}$/;
        if (!passwordexp.test(password)) {
            display.textContent = "Invalid Password! Password must be at least 8 characters long and contain at least one uppercase letter, lowercase letter, number, and special character.";
            return false;
        }
        var emailexp = /^[^@]+@[^@]+\.[a-zA-Z]{2,}$/;
        if (!emailexp.test(email)) {
            display.textContent = "Invalid Email!";
            return false;
        }
        if (password !== confirm) {
            display.textContent = "Passwords do not match";
            return false;
        }
        return storePasswords(event);
    }

    function storePasswords(event) {
        event.preventDefault();

        var username = document.getElementById("username").value;
        var password = document.getElementById("password").value;
        var confirm = document.getElementById("confirm_password").value;
        var email = document.getElementById("email").value;
        var display = document.getElementById("message-display");
        var savedProfiles = JSON.parse(localStorage.getItem("profiles") || "[]");
        for (var i = 0; i < savedProfiles.length; i++) {
            if (savedProfiles[i].username === username) {
                display.textContent = "Username already exists";
                return false;
            }
        }
        var newProfile = {
            username: username,
            password: password,
            email: email
        };

        savedProfiles.push(newProfile);
        localStorage.setItem("profiles", JSON.stringify(savedProfiles));

        display.className = "success";
        display.textContent = "Registration successful! Redirecting...";

        setTimeout(function () {
            window.location.href = "login.html";
        }, 1500);
        return true;
    }   
</script>

</html>
