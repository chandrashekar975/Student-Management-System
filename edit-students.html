<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Students</title>
    <nav>
        <a href="dashboard.html">Dashboard</a>   |
        <a href="add-students.html">Add Students</a>  |
        <a href="view-students.html">View Students</a> |
        <a href="logout.html">Logout</a>
    </nav>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Edit Student</h1>
    
    <form onsubmit="return updateStudent(event)">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>
        
        <label for="roll">Roll Number:</label><br>
        <input type="text" id="roll" name="roll" required><br><br>
        
        <label for="cgpa">CGPA:</label><br>
        <input type="number" id="cgpa" name="cgpa" step="0.01" min="0" max="10" required><br><br>

        <label for="branch">Branch:</label><br>
        <select id="branch" name="branch" required>
            <option value="">Select Branch</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="IT">IT</option>
            <option value="CIVIL">CIVIL</option>
            <option value="AI">AI</option>
            <option value="AID">AID</option>
            <option value="AIM">AIM</option>
            <option value="CSE-AIML">CSE-AIML</option>
            <option value="CSE-DS">CSE-DS</option>
            <option value="CSE-CS">CSE-CS</option>
        </select><br><br>
        
        <button type="submit">Update Student</button>
    </form> 

    <p id="message-display" class="error"></p>
</body>
<script>
    var studentIndex = null;

    window.onload = function() {
        var urlParams = new URLSearchParams(window.location.search);
        studentIndex = urlParams.get('id');

        if (studentIndex === null) {
            alert("No student selected!");
            window.location.href = "view-students.html";
            return;
        }

        var students = JSON.parse(localStorage.getItem("students") || "[]");
        var student = students[studentIndex];

        document.getElementById("name").value = student.name;
        document.getElementById("roll").value = student.roll;
        document.getElementById("cgpa").value = student.cgpa;
        document.getElementById("branch").value = student.branch;
    };

    function updateStudent(event) {
        event.preventDefault();

        var display = document.getElementById("message-display");

        var updatedName = document.getElementById("name").value;
        var updatedRoll = document.getElementById("roll").value;
        var updatedCgpa = document.getElementById("cgpa").value;
        var updatedBranch = document.getElementById("branch").value;

        var students = JSON.parse(localStorage.getItem("students") || "[]");

        students[studentIndex] = {
            name: updatedName,
            roll: updatedRoll,
            cgpa: updatedCgpa,
            branch: updatedBranch
        };

        localStorage.setItem("students", JSON.stringify(students));

        display.className = "success";
        display.textContent = "Student record updated successfully! Redirecting...";

        setTimeout(function() {
            window.location.href = "view-students.html";
        }, 1500);

        return true;
    }
</script>
</html>
