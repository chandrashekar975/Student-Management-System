<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Students</title>
    <nav>
        <a href="dashboard.html">Dashboard</a> |
        <a href="add-students.html">Add Students</a> |
        <a href="view-students.html">View Students</a> |
        <a href="logout.html">Logout</a>
    </nav>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Edit Student</h1>

    <form onsubmit="return updateStudent(event)">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="roll">Roll Number:</label><br>
        <input type="text" id="roll" name="roll" required><br><br>

        <label for="cgpa">CGPA:</label><br>
        <input type="number" id="cgpa" name="cgpa" step="0.01" min="0" max="10" required><br><br>

        <label for="branch">Branch:</label><br>
        <select id="branch" name="branch" required>
            <option value="">Select Branch</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="IT">IT</option>
            <option value="CIVIL">CIVIL</option>
            <option value="AI">AI</option>
            <option value="AID">AID</option>
            <option value="AIM">AIM</option>
            <option value="CSE-AIML">CSE-AIML</option>
            <option value="CSE-DS">CSE-DS</option>
            <option value="CSE-CS">CSE-CS</option>
        </select><br><br>

        <button type="submit">Update Student</button>
    </form>

    <p id="message-display" class="error"></p>
</body>
<script>
    var studentId = null;

    window.onload = async function () {
        studentId = new URLSearchParams(window.location.search).get('id');

        if (studentId === null) {
            alert("No student selected!");
            window.location.href = "view-students.html";
            return;
        }

        try {
            var response = await fetch("http://localhost:8080/students/" + studentId);

            if (response.ok) {
                var student = await response.json();

                document.getElementById("name").value = student.name;
                document.getElementById("roll").value = student.roll;
                document.getElementById("cgpa").value = student.cgpa;
                document.getElementById("branch").value = student.branch;
            } else {
                alert("Error: Could not retrieve student data from the server.");
                window.location.href = "view-students.html";
            }
        } catch (error) {
            console.error(error);
            alert("Cannot connect to backend server.");
        }
    };

    async function updateStudent(event) {
        event.preventDefault();

        var display = document.getElementById("message-display");
        display.textContent = "";
        display.className = "error";

        var updatedName = document.getElementById("name").value;
        var updatedRoll = document.getElementById("roll").value.toUpperCase();
        var updatedCgpa = document.getElementById("cgpa").value;
        var updatedBranch = document.getElementById("branch").value;

        var rollexp = /^[0-9]{2}[A-Z0-9]{4}[0-9]{2}[A-Z0-9]{2}$/;
        if (!rollexp.test(updatedRoll)) {
            display.textContent = "Invalid Roll Number";
            return false;
        }

        var updated = {
            name: updatedName,
            roll: updatedRoll,
            cgpa: parseFloat(updatedCgpa),
            branch: updatedBranch
        };

        try {
            var response = await fetch("http://localhost:8080/students/" + studentId, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(updated)
            });

            if (response.ok) {
                display.className = "success";
                display.textContent = "Student record updated successfully! Redirecting...";

                setTimeout(function () {
                    window.location.href = "view-students.html";
                }, 1500);
            } else {
                display.textContent = "Server error: Failed to update student records.";
            }
        } catch (error) {
            console.error(error);
            display.textContent = "Connection lost. Please verify backend state.";
        }

        return true;
    }
</script>

</html>
