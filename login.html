<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <nav>
        <a href="index.html">Home</a>   |
        <a href="login.html">Login</a>  |
        <a href="register.html">Register</a>
    </nav>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Login</h1>
    <form onsubmit="return validateForm(event)">
        <label for="username">Username: </label>
        <input type="text" id="username" name="username" required>
        <br><br>
        <label for="password">Password: </label>
        <input type="password" id="password" name="password" required>
        <br><br>
        <button type="submit">Login</button>
    </form>

    <p id="message-display" class="error"></p>

</body>
<script>
    function validateForm(event){
        var username = document.getElementById("username").value;
        var password = document.getElementById("password").value;
        var display = document.getElementById("message-display");

        display.textContent = "";
        display.className = "error"; 

        if(username.length < 8){
            event.preventDefault();
            display.textContent = "Username must be at least 8 characters long";
            return false;
        }
        if(password.length < 8){
            event.preventDefault();
            display.textContent = "Password must be at least 8 characters long";
            return false;
        }
        return checkCredentials(event);
    }

    function checkCredentials(event){
        var savedProfiles = JSON.parse(localStorage.getItem("profiles") || "[]");
        var username = document.getElementById("username").value;
        var password = document.getElementById("password").value;
        var display = document.getElementById("message-display");
        
        for(var i = 0; i < savedProfiles.length; i++){
            if(savedProfiles[i].username == username && savedProfiles[i].password == password){
                event.preventDefault();
                
                display.className = "success";
                display.textContent = "Login successful! Redirecting...";
                
                setTimeout(function() {
                    window.location.href = "dashboard.html";
                }, 1500);
                return true;
            }
        }
        event.preventDefault();
        display.textContent = "Invalid username or password";
        return false;
    }
</script>
</html>
