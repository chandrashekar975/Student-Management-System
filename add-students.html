<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Students</title>
    <nav>
        <a href="dashboard.html">Dashboard</a> |
        <a href="add-students.html">Add Students</a> |
        <a href="view-students.html">View Students</a> |
        <a href="logout.html">Logout</a>
    </nav>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Add Students</h1>
    <form onsubmit="return addStudent(event)">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="roll">Roll Number:</label><br>
        <input type="text" id="roll" name="roll" required><br><br>

        <label for="cgpa">CGPA:</label><br>
        <input type="number" id="cgpa" name="cgpa" step="0.01" min="0" max="10" required><br><br>

        <label for="branch">Branch:</label><br>
        <select id="branch" name="branch" required>
            <option value="">Select Branch</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="IT">IT</option>
            <option value="CIVIL">CIVIL</option>
            <option value="AI">AI</option>
            <option value="AID">AID</option>
            <option value="AIM">AIM</option>
            <option value="CSE-AIML">CSE-AIML</option>
            <option value="CSE-DS">CSE-DS</option>
            <option value="CSE-CS">CSE-CS</option>
        </select><br><br>
        <button type="submit">Add Student</button>
    </form>

    <p id="message-display" class="error"></p>
</body>
<script>
    async function addStudent(event) {
        event.preventDefault();

        var display = document.getElementById("message-display");
        display.textContent = "";
        display.className = "error";


        var name = document.getElementById("name").value;
        var roll = document.getElementById("roll").value.toUpperCase();
        var cgpa = document.getElementById("cgpa").value;
        var branch = document.getElementById("branch").value;

        var rollexp = /^[0-9]{2}[A-Z0-9]{4}[0-9]{2}[A-Z0-9]{2}$/;
        if (!rollexp.test(roll)) {
            display.textContent = "Invalid Roll Number";
            return false;
        }
        
        var student = {
            name: name,
            roll: roll,
            cgpa: parseFloat(cgpa),
            branch: branch
        }

        try {
            var response = await fetch(
                "http://localhost:8080/students",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(student)
                });

            if (response.ok) {
                display.className = "success";
                display.textContent = "Student added successfully! Redirecting...";
                setTimeout(function () {
                    window.location.href = "view-students.html";
                }, 1500);
            } else {
                display.textContent = "Server error: Could not save student details.";
            }
        } catch (error) {
            console.error("Network Error:", error);
            display.textContent = "Connection failed. Please check if the database is running.";
        }

        return true;
    }
</script>

</html>
