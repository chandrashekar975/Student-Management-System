<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Students</title>
    <nav>
        <a href="dashboard.html">Dashboard</a> |
        <a href="add-students.html">Add Students</a> |
        <a href="view-students.html">View Students</a> |
        <a href="logout.html">Logout</a>
    </nav>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>View Students</h1>
    <table border="2">
        <thead>
            <tr>
                <th>Name</th>
                <th>Roll Number</th>
                <th>CGPA</th>
                <th>Branch</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</body>
<script>
    window.onload = async function () {
        await displayStudents();
    };

    async function displayStudents() {
        var tbody = document.querySelector("tbody");
        tbody.innerHTML = "";

        try {
            var response = await fetch("http://localhost:8080/students");

            if (!response.ok) {
                tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; color:red;'>Failed to load student records from server.</td></tr>";
                return;
            }

            var students = await response.json();

            if (students.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>No student records found.</td></tr>";
                return;
            }

            for (var i = 0; i < students.length; i++) {
                var student = students[i];
                var row = document.createElement("tr");

                row.innerHTML =
                    "<td>" + student.name + "</td>" +
                    "<td>" + student.roll + "</td>" +
                    "<td>" + student.cgpa + "</td>" +
                    "<td>" + student.branch + "</td>" +
                    "<td><button onclick='editStudent(" + student.id + ")'>Edit</button>" +
                    "<button onclick='deleteStudent(" + student.id + ")'>Delete</button></td>";

                tbody.appendChild(row);
            }
        } catch (error) {
            console.error("Network Error:", error);
            tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; color:red;'>Cannot connect to backend server.</td></tr>"
        }
    }

    async function deleteStudent(index) {
        if(!confirm("Are you sure you want to delete this student?")){
            return;
        }
        
        try {
            var response = await fetch("http://localhost:8080/students/"+index,{
                method:"DELETE"
            });

            if(response.ok){
                alert("Student deleted successfully");
                await displayStudents();
            } else{
                alert("Server error. Could not delete student");
            }
        } catch (error) {
            console.error(error);
            alert("Connection Failed. Could not reach the server to delete");
        }
    }

    function editStudent(index) {
        window.location.href = "edit-students.html?id=" + index;
    }
</script>

</html>
