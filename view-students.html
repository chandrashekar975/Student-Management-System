<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Students</title>
    <nav>
        <a href="dashboard.html">Dashboard</a>   |
        <a href="add-students.html">Add Students</a>  |
        <a href="view-students.html">View Students</a> |
        <a href="logout.html">Logout</a>
    </nav>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>View Students</h1>
    <table border="2">
        <thead>
            <tr>
                <th>Name</th>
                <th>Roll Number</th>
                <th>CGPA</th>
                <th>Branch</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</body>
<script>
    window.onload = function() {
        displayStudents();
    };

    function displayStudents() {
        var tbody = document.querySelector("tbody");
        
        tbody.innerHTML = "";
        var students = JSON.parse(localStorage.getItem("students") || "[]");
        if (students.length === 0) {
            tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>No student records found.</td></tr>";
            return;
        }
        for (var i = 0; i < students.length; i++) {
            var student = students[i];

            var row = document.createElement("tr");

            row.innerHTML = 
                "<td>" + student.name + "</td>" +
                "<td>" + student.roll + "</td>" +
                "<td>" + student.cgpa + "</td>" +
                "<td>" + student.branch + "</td>" +
                "<td><button onclick='editStudent(" + i + ")'>Edit</button>"+
                "<button onclick='deleteStudent(" + i + ")'>Delete</button></td>";

            tbody.appendChild(row);
        }
    }

    function deleteStudent(index) {
        var students = JSON.parse(localStorage.getItem("students") || "[]");
        
        students.splice(index, 1);
        
        localStorage.setItem("students", JSON.stringify(students));
        displayStudents();
    }

    function editStudent(index) {
        window.location.href = "edit-students.html?id="+index;
    }
</script>

</html>
